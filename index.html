<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DevOps Practical</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="container">
        <h1>DevOps Practical Web App</h1>

        <p>
            This is a simple web application created for my DevOps practical.
        </p>

        <button onclick="showMessage()">
            Click Me
        </button>

        <p id="message"></p>
    </div>

    <script>
        function showMessage() {
            document.getElementById("message").innerHTML =
                "Hello! My DevOps web app is working successfully.";
        }
    </script>

</body>
</html>
